# Local Windows setup. Compose 2.24.4+ is required for !override.
# Automatically loaded with docker-compose.yml by `docker compose`.
name: onus

services:
  backend:
    ports: !override
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    environment: &local-settings
      OLLAMA_URL: "${OLLAMA_URL-}"
      LLM_PROVIDER: ollama
      SCANNER_BACKEND: local
      ONUS_ENV: development
      REQUIRE_AUTH: "false"
      HOSTED_QUEUE_ENABLED: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      APP_URL: "http://localhost:3000"
      MAX_CONCURRENT_SCANS: "${MAX_CONCURRENT_SCANS:-1}"
      SCAN_TIMEOUT_MULTIPLIER: "${SCAN_TIMEOUT_MULTIPLIER:-1.5}"

  worker:
    environment: *local-settings
    command: celery -A tasks.celery_app worker --loglevel=info -c 2
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      # Inside-container binding; the published host port remains loopback only.
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  # These services stay behind the upstream 'targets' profile and are NOT
  # started by Start-ONUS.ps1. Loopback binding alone is not lab isolation.
  # A separate approved isolation design is required before using that profile.
  juice-shop:
    ports: !override
      - "127.0.0.1:3001:80"
  dvwa:
    ports: !override
      - "127.0.0.1:8081:80"
  bwapp:
    ports: !override
      - "127.0.0.1:8083:80"
  mutillidae:
    ports: !override
      - "127.0.0.1:8084:80"
  nodegoat:
    ports: !override
      - "127.0.0.1:8085:80"
  dvwp-waf:
    ports: !override
      - "127.0.0.1:8444:443"
  webgoat:
    ports: !override
      - "127.0.0.1:8082:80"
